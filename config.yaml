# ============================================================
#  WEALTH FACTORY - settings
#  You normally never need to touch this file.
#  To change something, just ask Claude.
# ============================================================

channel:
  name: "Monezic"
  handle: "@monezic"
  # Free plans/guides are published here (GitHub Pages, folder docs/)
  plans_url: "https://thecreator-suleiman.github.io/wealth-factory-"
  # What the channel is about. Every video is written from this.
  niche: >
    Real money stories about PEOPLE and COMPANIES: who won big, who lost everything,
    and what really happened behind their success or failure (e.g. Jeff Bezos, Steve Jobs,
    Elon Musk, Aliko Dangote, Kodak, Nokia, Blockbuster, Enron). The one decision, risk,
    mistake or habit that changed everything - told as a gripping story with a money lesson.
    Mix world-famous stories with African success and failure stories.
  audience: "Young people (18-35) who want to understand money and build a better life."
  language: "English"
  # Safety rules the writer must always follow.
  rules:
    - "Tell real, widely documented stories only. Never invent people, companies, quotes or numbers."
    - "If you are not sure about an exact number or date, describe it without the number."
    - "Never give personal financial or investment advice. Teach through the story only."
    - "No get-rich-quick promises, no gambling, no crypto pumping, no scams."
    - "Urgent and skeptical is good; panic, doom predictions and fake certainty are not. Never predict exact crashes or dates."
    - "Do not write 'stop scrolling' or 'give me one minute' - the system adds that opening line itself. Beat 1 is the hook right after it."

video:
  target_seconds: 97        # about 1:35 per video (TikTok pays for 60s+)
  width: 1080
  height: 1920
  fps: 30

voice:
  main: "en-US-AndrewMultilingualNeural"   # calm, natural storyteller (free Microsoft neural voice)
  backup: "en-US-AndrewNeural"
  rate: "+4%"                     # calm but not slow
  pitch: "-2Hz"                   # a little deeper

music:
  folder: "assets/music"          # original piano tracks made by tools/make_music.py
  volume_db: -17                  # background level under the voice

posting:
  # Exact posting times (UTC). Runs start ~40 min early, finish the video, then wait.
  # 10:00 UTC = 12:00 Kigali, 22:00 UTC = 00:00 Kigali
  times_utc: ["10:00", "22:00"]
  platforms: ["tiktok", "instagram", "youtube"]
  youtube_category: "27"          # 27 = Education
  # AI label per platform, following each platform's own rules:
  # - YouTube: not required for animated/cartoon videos with a generic AI narrator.
  # - TikTok and Instagram: required for "realistic AI audio" - our AI voiceover counts.
  ai_label:
    youtube: false
    tiktok: true
    instagram: true
  hashtags_max: 5

telegram:
  chat_id: "-1003707850121"       # your "Shorts_Media_Vault" channel

# WhatsApp alert with the YouTube link (free CallMeBot service).
# Needs 2 GitHub secrets: WHATSAPP_PHONE and CALLMEBOT_API_KEY. Skipped if missing.

# Formats rotate so the channel never looks mass-produced.
# What each slot in a 10-video cycle is (60% stories, 20% business ideas, 10% free tools, 10% news).
mix: [story, business, story, story, tool, story, story, news, story, business]

formats:
  - kind: story
    name: "Behind the success"
    brief: "What really happened behind a famous success (a billionaire or a giant company): the risk, the near-failure, the one move nobody talks about."
  - kind: story
    name: "Rise and fall"
    brief: "A person or company that rose very high and then lost almost everything. Show the warning signs everyone ignored."
  - kind: story
    name: "The one decision"
    brief: "One single decision that made or destroyed a fortune. Build up to the decision, then reveal what happened."
  - kind: story
    name: "From nothing"
    brief: "Someone who started with almost nothing and built a fortune. Focus on the specific, surprising thing they did differently."
  - kind: story
    name: "The biggest mistake"
    brief: "A famous money mistake (a company that said no to a deal, sold too early, ignored a trend) and what it cost."
  - kind: story
    name: "African empire"
    brief: "A real African entrepreneur or company: how it was built, the risk taken, the setbacks, and the lesson."
  - kind: business
    name: "Business you can start"
    brief: "One realistic, low-cost business idea a young person can start this month (with under $200 where possible): why it works, real examples of people doing it, the first 3 steps. No get-rich-quick promises."
  - kind: tool
    name: "Free money tool"
    brief: "One genuinely FREE, well-known online tool or app for money (budgeting, saving, investing research, invoicing, learning finance): what it does, a real use case, and the catch. Only real tools that exist today."
  - kind: news
    name: "Money news"
    brief: "One real money/economy story from the last 7 days (markets, prices, jobs, a big company, AI money) explained casually, and what it means for normal people."
