name: Wealth Factory

on:
  schedule:
    # Times are UTC. GitHub often starts scheduled runs 20-40 min late and a run
    # takes ~10 min, so they are set 40 min early:
    # 09:50 UTC -> posted about 12:00 Kigali (11:00 Europe, 06:00 New York)
    # 21:50 UTC -> posted about 00:00 Kigali (23:00 Europe, 17:00 New York)
    - cron: "20 9 * * *"
    - cron: "20 21 * * *"
    # Backups: GitHub sometimes skips a scheduled run. These run only if the slot wasn't posted.
    - cron: "5 10 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Post to TikTok, Instagram and YouTube? (leave unticked for a test - video goes only to Telegram)"
        type: boolean
        default: false
      test_backup:
        description: "Test the Groq backup writer (pretend Gemini is down)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wealth-factory
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config > /dev/null
          pip install -q -r requirements.txt
          mkdir -p work/fonts ~/.local/share/fonts
          if curl -fsSL -o work/fonts/Anton-Regular.ttf \
               https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf; then
            cp work/fonts/Anton-Regular.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          else
            echo "Font download failed - using backup font"; rm -f work/fonts/Anton-Regular.ttf
          fi

      - name: Make and post the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_BACKUP: ${{ inputs.test_backup }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATABOT_API_KEY: ${{ secrets.WHATABOT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TO_SOCIALS: ${{ github.event_name == 'schedule' && 'true' || inputs.post }}
        run: python -m factory.main

      - name: Save what was posted (so topics never repeat)
        if: always()
        run: |
          git add -A docs 2>/dev/null || true
          if git diff --quiet -- data/history.json && git diff --cached --quiet -- docs; then exit 0; fi
          git config user.name "wealth-factory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json docs
          git commit -q -m "history: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done

      - name: Keep a copy of the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            work/*/final.mp4
            work/*/story.json
          retention-days: 7
          if-no-files-found: ignore
