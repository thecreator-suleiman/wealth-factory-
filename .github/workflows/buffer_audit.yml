name: Buffer audit (read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - name: List posts per channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAYS: ${{ inputs.days }}
        run: python tools/buffer_audit.py
