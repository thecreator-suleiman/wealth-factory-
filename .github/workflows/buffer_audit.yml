name: Buffer audit (read-only)

on:
  schedule:
    - cron: "30 15 * * *"   # daily 17:30 Kigali - Telegram message ONLY if something went wrong
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - name: List posts per channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAYS: ${{ inputs.days || '1' }}
          ALERT: ${{ github.event_name == 'schedule' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/buffer_audit.py
